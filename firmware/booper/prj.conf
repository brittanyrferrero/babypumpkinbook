# NTAG NDEF writer — Elecrow nRF52840 + RC522 scanner board, USB CDC console.
# Build (NCS workspace, same as the scanner):
#   west build -d build_ntag -b adafruit_feather_nrf52840/nrf52840/uf2 tools/ntag-writer
# No Thread, no PM: this is a bench tool that lives on USB.

# Flash layout: app starts at 0x26000 (after Adafruit UF2/SoftDevice bootloader)
CONFIG_USE_DT_CODE_PARTITION=y

CONFIG_SPI=y
CONFIG_GPIO=y

CONFIG_PM=n
CONFIG_PM_DEVICE=n

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_STACK_NEXT=n
CONFIG_USB_CDC_ACM=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_DEVICE_PRODUCT="NTAG Writer"
CONFIG_USB_DEVICE_MANUFACTURER="rfid-thread-scanner"

CONFIG_MAIN_STACK_SIZE=4096

# The Elecrow clone may not have a 32 kHz crystal; the scanner builds never
# rely on one (MPSL clock control). Use the RC oscillator.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
